# Generic Fly.io app config for the orchestrator. Override `app` per deployment
# (or use `clients/<slug>.toml` with the multi-client deploy workflow).
app = "ai-implement"
primary_region = "iad"
kill_timeout = 15

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[mounts]
  source = "dedup_data"
  destination = "/data"

# Restart the machine when the orchestrator exits non-zero. Boot exits 1 when the
# Restate sidecar cannot serve (ADR 023 amendment); policy restarts stop after 10
# failures in a row. Proxy auto-start remains enabled and can start a stopped
# machine on incoming traffic, so this retry cap does not guarantee it stays stopped.
[[restart]]
  policy = "on-failure"
  retries = 10
