name: Claude PR review

# This workflow is a convenience for this repo's own development — it is NOT
# part of the AI-Implement product surface that gets synced to target repos.
# It auths via CLAUDE_CODE_OAUTH_TOKEN only. If you fork this repo and want to
# wire up a different auth path (Anthropic API key, Bedrock, Vertex), see
# https://github.com/anthropics/claude-code-action and customise this file —
# upstream won't try to keep a one-size-fits-all auth matrix working here.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the pull request to review.
        required: true
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  id-token: write

jobs:
  claude-review:
    name: PR review run
    # Auto-run on same-repo PRs (opened/ready_for_review/synchronize). For fork PRs and
    # re-runs, a maintainer must post `/claude-review` as a comment — forks must not
    # auto-run on synchronize because pull_request_target has repository-secret access
    # and that would be a priv-esc vector.
    #
    # A draft PR is skipped, with one exception: a push (synchronize) by the orchestrator
    # bot. A gap-fill run pushes to a PR that an operator may hold in Draft; if the review
    # skipped that head, LateExternalReview would wait its full 30 minutes and end
    # `timed-out`, and the head would get no review until a person marked the PR ready.
    # Auto-merge skips a draft PR, so the Draft gate still holds after an approval.
    # The login is the `actor` GitHub records on this repo's bot-pushed runs.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/claude-review') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    # Collapse rapid push bursts: cancel the superseded run and review the settled head.
    # This MUST stay at job level, not workflow level. A workflow-level group is claimed
    # the moment a run is created — before `if:` is evaluated — so any issue_comment (not
    # just `/claude-review`), or a synchronize push to a draft PR, would cancel an
    # in-flight legitimate review and then skip its own job. The killed review leaves no
    # verdict, which the post-push gate correctly refuses, which resolves to
    # review_failed and counts toward the dispatch breaker. At job level the group is
    # only claimed once `if:` passes, so a skipped job cancels nothing.
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('claude-review-dispatch-{0}', inputs.pr_number) || format('claude-review-{0}', github.event.issue.number) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.pr_number
              : context.payload.issue.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('number', pr.data.number);

      - name: Create review check run
        id: check
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'claude-review',
              head_sha: process.env.HEAD_SHA,
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.setOutput('id', check.data.id);

      # Checkout PR head with credentials persisted — the claude-code-action
      # runs its own `git fetch` internally and needs the credential helper set
      # up by actions/checkout. We never run install/build/test steps on this
      # checkout, so the diff-reading flow doesn't execute untrusted code.
      #
      # This MUST run before the trusted-actions checkout below. actions/checkout
      # defaults to `clean: true`, which runs `git clean -ffdx` in its target
      # directory before fetching. Since this checkout targets the workspace
      # root ('.'), and a later-added trusted-actions/ nested git checkout would
      # be untracked from root's point of view, that clean would force-delete it
      # (the double `-f` removes nested .git dirs too). Checking out the PR head
      # into an empty root first, then adding trusted-actions/ afterward, avoids
      # this — the trusted-actions checkout's own default clean only touches its
      # own (empty) subdirectory.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      # Load the composite action from the repo's own trusted ref,
      # not from the PR-head checkout above.
      # With no `ref:`, actions/checkout gets the triggering event's ref, never the PR head.
      # On GitHub.com, that is the default branch for both triggers.
      # So a fork PR, reachable here via the maintainer `/claude-review` comment path,
      # cannot rewrite the composite action to run arbitrary steps with this job's secrets
      # by editing .github/actions/claude-review in its own diff.
      # A change to this workflow or its action likewise reaches PRs only from there.
      # GitHub Enterprise Server before 3.20 differs:
      # there, pull_request_target runs from the PR's base branch.
      # Keep this checkout at a distinct path from the PR-head checkout above,
      # and after it (see note above).
      - name: Checkout trusted composite action
        uses: actions/checkout@v4
        with:
          path: trusted-actions

      - name: Run Claude review
        id: review
        uses: ./trusted-actions/.github/actions/claude-review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ steps.pr.outputs.number }}

      - name: Complete review check run
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_RUN_ID: ${{ steps.check.outputs.id }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: process.env.CHECK_RUN_ID,
              status: 'completed',
              conclusion: process.env.REVIEW_OUTCOME === 'success' ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
            });
