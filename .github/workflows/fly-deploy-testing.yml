name: Fly.io deploy on push to testing

on:
    push:
        branches:
            - testing

concurrency:
    group: deploy-testing
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy staging app
        runs-on: ubuntu-latest
        # stays inert if this file ever rides a testing -> main merge-up
        if: github.ref == 'refs/heads/testing'
        steps:
            - uses: actions/checkout@v6
            - uses: superfly/flyctl-actions/setup-flyctl@v1

            - name: Deploy
              run: flyctl deploy --remote-only --app ai-implement-testing-orchestrator
              env:
                FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_TESTING }}
