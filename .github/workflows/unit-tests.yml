# Unit-test gate for AI-Implement PRs (AII-449).
#
# Named unit-tests.yml deliberately: the claude-*.yml files here are TEMPLATES
# synced to target repos, and sync-workflow.yml is the sync fallback — this file
# is neither, and must never be distributed by sync.
#
# Operator step after first merge: mark the "unit-tests" check REQUIRED on the
# testing branch (Settings → Branches). The branch is unprotected today, so the
# check is advisory until that click.
#
# Grouping branches (ai-implement/feature/**, ai-implement/multi-issue/**) are
# listed so child PRs in feature-branch grouping runs get the unit-test check
# before their changes merge into the feature branch (AII-467).
name: unit-tests

on:
  pull_request:
    branches: [testing, main, "ai-implement/feature/**", "ai-implement/multi-issue/**"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # vitest exits non-zero on test failures AND on unhandled errors
      # (verified on AII-448: 28 unhandled rejections alone produced exit 1
      # while all tests passed — the exact signal this gate exists to catch).
      #
      # Ambient Actions vars are scrubbed for the test step: orchestrator code
      # branches on GITHUB_RUN_ID / GITHUB_ENV / etc., and the suite asserts
      # the non-CI defaults (first run of this gate proved it: reporter tests
      # picked up the job's own run id). The suite must see the same env shape
      # locally and here.
      - name: npm test (ambient CI vars scrubbed)
        run: |
          unset GITHUB_RUN_ID GITHUB_ENV GITHUB_REPOSITORY GITHUB_REF_NAME                 GITHUB_EVENT_NAME GITHUB_SHA GITHUB_ACTIONS GITHUB_ACTION
          npm test
      - run: npm run typecheck

  # Restate harness tests (AII-612): src/__tests__/*.restate.test.ts, run with
  # Docker via testcontainers. A job inside this file rather than a new
  # workflow, deliberately — it must inherit the pull_request branch list
  # above (including ai-implement/feature/**), the same reason unit-tests
  # lives here (AII-467).
  restate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Restate server image has no version pinned in this harness (it
      # tracks whatever @restatedev/restate-sdk-testcontainers' RestateContainer
      # defaults to), so the cache key is time-boxed rather than tag-pinned: a
      # week-old cache is still a valid warm start for `docker load`, and a
      # cache miss just falls back to testcontainers' own `docker pull`.
      - name: Restate image cache key
        id: restate-image-cache-key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore cached Restate server image
        id: restate-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/restate-image-cache/restate.tar
          key: restate-server-image-${{ steps.restate-image-cache-key.outputs.week }}
          restore-keys: |
            restate-server-image-
      - name: Load cached Restate server image
        if: hashFiles('/tmp/restate-image-cache/restate.tar') != ''
        run: docker load -i /tmp/restate-image-cache/restate.tar
      - name: npm run test:restate (ambient CI vars scrubbed)
        run: |
          unset GITHUB_RUN_ID GITHUB_ENV GITHUB_REPOSITORY GITHUB_REF_NAME                 GITHUB_EVENT_NAME GITHUB_SHA GITHUB_ACTIONS GITHUB_ACTION
          npm run test:restate
      - name: Save Restate server image to cache
        if: always()
        run: |
          mkdir -p /tmp/restate-image-cache
          docker save docker.io/restatedev/restate:latest -o /tmp/restate-image-cache/restate.tar
