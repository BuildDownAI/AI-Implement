# Unit-test gate for AI-Implement PRs (AII-449).
#
# Named unit-tests.yml deliberately: the claude-*.yml files here are TEMPLATES
# synced to target repos, and sync-workflow.yml is the sync fallback — this file
# is neither, and must never be distributed by sync.
#
# Operator step after first merge: mark the "unit-tests" check REQUIRED on the
# testing branch (Settings → Branches). The branch is unprotected today, so the
# check is advisory until that click.
#
# Grouping branches (ai-implement/feature/**, ai-implement/multi-issue/**) are
# listed so child PRs in feature-branch grouping runs get the unit-test check
# before their changes merge into the feature branch (AII-467).
name: unit-tests

on:
  pull_request:
    branches: [testing, main, "ai-implement/feature/**", "ai-implement/multi-issue/**"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # vitest exits non-zero on test failures AND on unhandled errors
      # (verified on AII-448: 28 unhandled rejections alone produced exit 1
      # while all tests passed — the exact signal this gate exists to catch).
      #
      # Ambient Actions vars are scrubbed for the test step: orchestrator code
      # branches on GITHUB_RUN_ID / GITHUB_ENV / etc., and the suite asserts
      # the non-CI defaults (first run of this gate proved it: reporter tests
      # picked up the job's own run id). The suite must see the same env shape
      # locally and here.
      - name: npm test (ambient CI vars scrubbed)
        run: |
          unset GITHUB_RUN_ID GITHUB_ENV GITHUB_REPOSITORY GITHUB_REF_NAME                 GITHUB_EVENT_NAME GITHUB_SHA GITHUB_ACTIONS GITHUB_ACTION
          npm test
      - run: npm run typecheck
      - run: npx tsc --noEmit --project tsconfig.review-fix-ports-tests.json
      - run: npx tsc --noEmit --project tsconfig.dispatch-admission-tests.json
      - run: npx tsc --noEmit --project tsconfig.review-fix-attempt-store-tests.json
      - run: npx tsc --noEmit --project tsconfig.review-fix-finalize-tests.json

  # Restate harness (AII-612): src/__tests__/restate/**/*.restate.test.ts, isolated from
  # `unit-tests` above because it needs Docker for testcontainers. No `on:` block
  # here on purpose — a job inherits the workflow's triggers only by staying in
  # this file, which is what gets it onto ai-implement/feature/** PRs (AII-467
  # pattern). No `needs:` either: it runs in parallel with `unit-tests` so this
  # job's own time, not the sum, is what the ~2-minutes budget has to cover.
  restate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned (not `latest`) so the image cache key below is stable and so a
      # new Restate release can't silently change the harness's behavior.
      # Keep in sync with the `RESTATE_IMAGE_VERSION` constant in
      # src/__tests__/restate/harness.ts.
      RESTATE_IMAGE_TAG: "1.7.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # testcontainers pulls this image on every RestateTestEnvironment.start();
      # caching the `docker save` tar keeps that pull off the network on a cache
      # hit, which is what keeps this job's added time near ~2 minutes.
      - name: Cache Restate container image
        id: restate-image-cache
        uses: actions/cache@v4
        with:
          path: ~/restate-image-cache
          key: restate-image-${{ env.RESTATE_IMAGE_TAG }}
      - name: Load cached Restate image
        if: steps.restate-image-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/restate-image-cache/restate.tar
      - name: Pull and cache Restate image
        if: steps.restate-image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "docker.io/restatedev/restate:${RESTATE_IMAGE_TAG}"
          mkdir -p ~/restate-image-cache
          docker save "docker.io/restatedev/restate:${RESTATE_IMAGE_TAG}" -o ~/restate-image-cache/restate.tar
      - name: npm run test:restate (ambient CI vars scrubbed)
        run: |
          unset GITHUB_RUN_ID GITHUB_ENV GITHUB_REPOSITORY GITHUB_REF_NAME                 GITHUB_EVENT_NAME GITHUB_SHA GITHUB_ACTIONS GITHUB_ACTION
          npm run test:restate
      - run: npx tsc --noEmit --project tsconfig.restate-tests.json
