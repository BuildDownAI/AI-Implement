name: Publish orchestrator image

on:
  push:
    branches: [testing, main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish (its current head)
        type: choice
        required: true
        default: testing
        options: [testing, main]

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: orchestrator-image-build-${{ inputs.branch || github.ref_name }}
      cancel-in-progress: true
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.branch }}
          persist-credentials: false
      - name: Resolve source commit
        id: meta
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Validate without publishing; superseded builds can safely be cancelled.
      - name: Validate image build
        run: docker build --no-cache --tag orchestrator-validation .

  publish:
    needs: build
    # GitHub re-evaluates job conditions on cancellation. Keep the entire build,
    # guard, pushes and their bookkeeping alive once this job starts.
    if: ${{ always() && needs.build.result == 'success' }}
    concurrency:
      group: orchestrator-image-publish-${{ inputs.branch || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The public copy goes to this repository owner's GHCR namespace, pushed with the job's own token.
    permissions:
      contents: read
      statuses: write
      packages: write
    env:
      SOURCE_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Check the branch and the Fly image push token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IMAGE_PUSH_TOKEN }}
        run: |
          case "$SOURCE_BRANCH" in
            testing|main) ;;
            *) echo '::error::Only testing and main can be published.'; exit 1 ;;
          esac
          # Control-plane machines deploy BuildDown's Fly image, so this repository cannot publish without it.
          # A fork publishes its public GHCR image alone.
          if [ -z "$FLY_API_TOKEN" ] && [ "$GITHUB_REPOSITORY" = "BuildDownAI/AI-Implement" ]; then
            echo '::error::FLY_IMAGE_PUSH_TOKEN is required: configure a deploy token scoped to builddown-orchestrator-image.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Pushes publish the event commit; dispatch resolves the selected head once.
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Resolve image metadata
        id: meta
        run: |
          commit=$(git rev-parse HEAD)
          tag="${SOURCE_BRANCH}-${commit:0:7}"
          # Registry repository names are lowercase, while an owner keeps its casing.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "commit=$commit"
            echo "ghcr=ghcr.io/$owner/ai-implement-orchestrator:$tag"
            echo "fly=registry.fly.io/builddown-orchestrator-image:$tag"
          } >> "$GITHUB_OUTPUT"

      # One build, on this runner, so the image the guard reads is the image both registries get.
      # No cache: the base template and the Python dependencies are fetched at build time.
      - name: Build the image
        id: build
        env:
          SOURCE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          docker build --no-cache --tag orchestrator-publish \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg "SOURCE_COMMIT=$SOURCE_COMMIT" \
            --build-arg "SOURCE_REPO=$GITHUB_REPOSITORY" \
            --build-arg "SOURCE_BRANCH=$SOURCE_BRANCH" \
            .

      # The image becomes public, so it must hold nothing a private knowledge graph source adds.
      # KG_SOURCE_REPO is the one input that brings one in, and these paths are what it copies or builds.
      - name: Guard against a private knowledge graph
        id: guard
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          if docker image inspect orchestrator-publish --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^KG_SOURCE_REPO=.'; then
            echo '::error::The image was built with KG_SOURCE_REPO set, so it may hold a private knowledge graph. A published image never does.'
            exit 1
          fi
          found=$(docker run --rm --entrypoint sh orchestrator-publish -c 'cd /app/kg && for p in snapshot sources.yml out; do if [ -e "$p" ]; then echo "$p"; fi; done')
          if [ -n "$found" ]; then
            echo "::error::/app/kg holds $(echo $found), which only a private knowledge graph source adds."
            exit 1
          fi

      - name: Log in to GHCR
        id: ghcr-login
        if: ${{ always() && steps.guard.outcome == 'success' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push-ghcr
        if: ${{ always() && steps.ghcr-login.outcome == 'success' }}
        env:
          GHCR_IMAGE: ${{ steps.meta.outputs.ghcr }}
        run: |
          docker tag orchestrator-publish "$GHCR_IMAGE"
          docker push "$GHCR_IMAGE"

      # Another Fly organization pulls the image with no credentials, the way this reads it:
      # an anonymous pull token, then the manifest. SelfDeploy.start makes the same read before its hold.
      - name: Check that anyone can pull the GHCR image
        id: readable
        if: ${{ always() && steps.push-ghcr.outcome == 'success' }}
        env:
          GHCR_IMAGE: ${{ steps.meta.outputs.ghcr }}
        run: |
          ref="${GHCR_IMAGE#ghcr.io/}"
          name="${ref%:*}"
          tag="${ref##*:}"
          private="::error::$GHCR_IMAGE cannot be pulled anonymously. Make the package public (Package settings, Change visibility), then re-run this job."
          token_status=$(curl -s -o token.json -w '%{http_code}' "https://ghcr.io/token?scope=repository:$name:pull")
          case "$token_status" in
            200) ;;
            401|403|404) echo "$private"; exit 1 ;;
            *) echo "::error::GHCR answered HTTP $token_status to the anonymous token request. Re-run this job once GHCR recovers."; exit 1 ;;
          esac
          token=$(jq -er .token token.json)
          # GHCR answers an OCI image index with 404 unless the request accepts that type.
          accept='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'
          manifest_status=$(curl -s -o /dev/null -I -w '%{http_code}' -H "Authorization: Bearer $token" -H "Accept: $accept" "https://ghcr.io/v2/$name/manifests/$tag")
          case "$manifest_status" in
            200) ;;
            401|403) echo "$private"; exit 1 ;;
            404) echo "::error::GHCR has no manifest for $GHCR_IMAGE, though its push succeeded. Re-run this job."; exit 1 ;;
            *) echo "::error::GHCR answered HTTP $manifest_status to the anonymous manifest read of $GHCR_IMAGE. Re-run this job once GHCR recovers."; exit 1 ;;
          esac

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: ${{ always() && steps.readable.outcome == 'success' }}

      - name: Push to Fly's registry
        id: push-fly
        if: ${{ always() && steps.readable.outcome == 'success' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IMAGE_PUSH_TOKEN }}
          FLY_IMAGE: ${{ steps.meta.outputs.fly }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo 'No FLY_IMAGE_PUSH_TOKEN, so only the GHCR image is published.'
            exit 0
          fi
          flyctl auth docker
          docker tag orchestrator-publish "$FLY_IMAGE"
          docker push "$FLY_IMAGE"

      - name: Record published image
        # The job and bookkeeping both remain eligible during cancellation.
        if: ${{ always() && steps.push-fly.outcome == 'success' }}
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.commit }}
          GHCR_IMAGE: ${{ steps.meta.outputs.ghcr }}
        run: |
          echo "Published image: \`$GHCR_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_COMMIT" \
            -f state=success \
            -f context=orchestrator-image/published \
            -f "description=$GHCR_IMAGE" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
