id: kg-refresh
steps:
  - id: clone
    type: clone
    depth: full
  - id: kg-scope-reconcile
    type: custom
    moduleId: kg-scope-reconcile
  - id: dependency-auth
    type: custom
    moduleId: dependency-auth
  - id: clone-code-repo
    type: clone
    depth: full
  - id: clone-secondary-repos
    type: clone
    depth: full
  - id: kg-tracker-data
    type: custom
    moduleId: kg-tracker-data
  - id: kg-ingest
    type: custom
    moduleId: kg-ingest
  # No agent step: the ingest is deterministic and kg-snapshot-push is the guard and the
  # report. An agent in this workspace re-ran the ingest without a GitHub token and deleted
  # snapshot/parts/pr.nt (AII-575 runs 2–4, 2026-09-08).
  - id: kg-snapshot-push
    type: custom
    moduleId: kg-snapshot-push
